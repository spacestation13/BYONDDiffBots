[package]
name = "icondiffbot2"
version = "0.1.0"
edition = "2024"
license = "MIT"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
octocrab = "0.54.1"
dmm-tools = { git = "https://github.com/jupyterkat/SpacemanDMM/" }
# pinned to the same version that octocrab uses, dont change unless octocrab does
jsonwebtoken = "10.4.0"
reqwest = "0.13.4"
diffbot_lib = { path = "../diffbot_lib" }
eyre = "0.6.14"
simple-eyre = "0.3.1"
rayon = "1.12.0"
toml = "1.1.4"
ahash = "0.8.12"
hashbrown = { version = "0.17.1", features = ["rayon"] }
tracing-loki = "0.2.7"
flume = "0.12.0"
mysql_async = "0.37.0"
time = "0.3.55"
secrecy = "0.10.3"
percent-encoding = "2.3.2"
dashmap = "6.2.1"
indexmap = { version = "2.14.0", features = ["rayon"] }

actix-web = "4.14.1"
actix-files = "0.6.10"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7.0"

[dependencies.tracing]
version = "0.1.44"
features = ["attributes"]
