[package]
name = "mapdiffbot2"
version = "0.1.0"
edition = "2024"
license = "MIT"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
toml = "1.1.4"
octocrab = "0.54.1"
dmm-tools = { git = "https://github.com/jupyterkat/SpacemanDMM/" }
dreammaker = { git = "https://github.com/jupyterkat/SpacemanDMM/" }
ahash = "0.8.12"
# pinned to the same version that octocrab uses, dont change unless octocrab does
jsonwebtoken = "10.4.0"
eyre = "0.6.14"
simple-eyre = "0.3.1"
path-absolutize = "4.0.1"
rayon = "1.12.0"
image = "0.25.10"
diffbot_lib = { path = "../diffbot_lib" }
git2 = "0.21.0"
walkdir = "2.5.0"
tokio-cron-scheduler = "0.15.1"
itertools = "0.15.0"
indexmap = { version = "2.14.0", features = ["rayon"] }
tracing-loki = "0.2.7"
flume = "0.12.0"
object_store = { version = "0.14.1", features = ["azure"] }
mysql_async = "0.37.0"
time = "0.3.55"
secrecy = "0.10.3"
dashmap = "6.2.1"

actix-web = "4.14.1"
actix-files = "0.6.10"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7.0"
