[package]
name = "mapdiffbot2"
version = "0.1.0"
edition = "2024"
license = "MIT"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143" }
toml = "0.9.5"
octocrab = "0.44.1"
dmm-tools = { git = "https://github.com/jupyterkat/SpacemanDMM/" }
dreammaker = { git = "https://github.com/jupyterkat/SpacemanDMM/" }
ahash = "0.8.12"
jsonwebtoken = "9.3.1"
eyre = "0.6.12"
simple-eyre = "0.3.1"
rayon = "1.11.0"
image = "0.25.6"
diffbot_lib = { path = "../diffbot_lib" }
git2 = "0.20.2"
walkdir = "2.5.0"
tokio-cron-scheduler = "0.14.0"
itertools = "0.14.0"
indexmap = { version = "2.11.0", features = ["rayon"] }
tracing-loki = "0.2.6"
flume = "0.11.1"
object_store = { version = "0.12.3", features = ["azure"] }
mysql_async = "0.36.1"
time = "0.3.41"
secrecy = "0.10.3"
dashmap = "6.1.0"

actix-web = "4.11.0"
actix-files = "0.6.6"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6.0"
