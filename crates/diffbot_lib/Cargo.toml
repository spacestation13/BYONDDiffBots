[package]
name = "diffbot_lib"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
octocrab = "0.54.1"
eyre = "0.6.14"
derive_builder = "0.20.2"
chrono = "0.4.45"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "time"] }
tracing-panic = "0.1.2"
tracing-loki = "0.2.7"
flume = "0.12.0"

actix-web = "4.14.1"
